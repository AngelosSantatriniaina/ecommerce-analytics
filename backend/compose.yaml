services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-mada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop_mada
      POSTGRES_USER: shop_mada
      POSTGRES_PASSWORD: shop_mada_dev
    ports:
      - "5432:5432"
    volumes:
      - shop-mada-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_mada -d shop_mada"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shop-mada-postgres-data: